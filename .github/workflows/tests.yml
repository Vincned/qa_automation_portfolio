name: QA Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run API and UI tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      API_BASE_URL: https://jsonplaceholder.typicode.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest --alluredir=allure-results --clean-alluredir

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Generate and publish Allure report
    needs: test

    # We publish the report only after a push to main,
    # but we generate it even if the tests fail.
    if: ${{ always() && needs.test.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest

    # Write access is required only for the report-publishing task.
    permissions:
      contents: write

    steps:
      - name: Download Allure results
        id: download-results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Checkout previous report history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Ensure history directory exists
        run: mkdir -p gh-pages

      - name: Generate Allure report with history
        id: build-report
        if: ${{ always() && steps.download-results.outcome == 'success' }}
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          report_name: QA Automation Portfolio

      - name: Upload HTML report
        if: ${{ always() && steps.build-report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-history/
          if-no-files-found: error
          retention-days: 14

      - name: Publish report to GitHub Pages
        if: ${{ always() && steps.build-report.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
